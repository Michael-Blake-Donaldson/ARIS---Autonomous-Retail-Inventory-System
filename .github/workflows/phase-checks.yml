name: Build and test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, preset: windows-debug }
          - { os: windows-2022, preset: windows-release }
          - { os: ubuntu-24.04, preset: linux-ci }
    env:
      VCPKG_DISABLE_METRICS: '1'
      VCPKG_MAX_CONCURRENCY: '4'
    steps:
      - name: Check out ARGUS
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Read the vcpkg baseline
        id: baseline
        shell: pwsh
        run: |
          $baseline = (Get-Content -Raw vcpkg.json | ConvertFrom-Json).'builtin-baseline'
          if ($baseline -cnotmatch '^[0-9a-f]{40}$') { throw 'Invalid vcpkg baseline' }
          "sha=$baseline" >> $env:GITHUB_OUTPUT

      - name: Check out pinned vcpkg
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: microsoft/vcpkg
          ref: ${{ steps.baseline.outputs.sha }}
          path: .build-tools/vcpkg
          persist-credentials: false

      - name: Restore vcpkg binary cache
        id: cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/argus-vcpkg-cache
          key: vcpkg-${{ matrix.os }}-${{ runner.arch }}-${{ matrix.preset }}-${{ hashFiles('vcpkg.json', 'CMakePresets.json') }}

      - name: Set up build environment
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:GITHUB_WORKSPACE '.build-tools/vcpkg'
          $binaryCache = Join-Path $env:RUNNER_TEMP 'argus-vcpkg-cache'
          "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
          "VCPKG_BINARY_SOURCES=clear;files,$binaryCache,readwrite" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force $binaryCache | Out-Null

      - name: Install Linux verification tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 clang-tidy-18 clang-format-18 libclang-rt-18-dev

      - name: Check C++ formatting
        if: runner.os == 'Linux'
        run: git ls-files -z -- '*.cpp' '*.hpp' '*.hpp.in' | xargs -0 -r clang-format-18 --dry-run --Werror

      - name: Configure, build and test Linux with sanitizers
        if: runner.os == 'Linux'
        run: |
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          cmake --workflow --preset linux-ci

      - name: Fuzz input boundaries with sanitizers
        if: runner.os == 'Linux'
        run: |
          cmake --preset linux-fuzz
          cmake --build --preset linux-fuzz --parallel 3
          bash tools/run-phase11-fuzz.sh

      - name: Configure, build and test Windows
        if: runner.os == 'Windows'
        shell: cmd
        env:
          ARGUS_PRESET: ${{ matrix.preset }}
        run: |
          for /f "usebackq delims=" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS_INSTALL=%%I"
          if not defined VS_INSTALL exit /b 1
          call "%VS_INSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 || exit /b 1
          set "VCPKG_ROOT=%GITHUB_WORKSPACE%\.build-tools\vcpkg"
          call "%VCPKG_ROOT%\bootstrap-vcpkg.bat" -disableMetrics || exit /b 1
          cmake --workflow --preset "%ARGUS_PRESET%" || exit /b 1

      - name: Save verified vcpkg binaries from the default branch
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/argus-vcpkg-cache
          key: ${{ steps.cache.outputs.cache-primary-key }}
