name: Windows release candidate

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  portable:
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      VCPKG_DISABLE_METRICS: '1'
      VCPKG_MAX_CONCURRENCY: '4'
    steps:
      - name: Check out the version tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Resolve the pinned vcpkg commit
        id: registry
        shell: pwsh
        run: |
          $manifest = Get-Content vcpkg.json -Raw | ConvertFrom-Json
          $baseline = $manifest.'builtin-baseline'
          if ($baseline -cnotmatch '^[0-9a-f]{40}$' -or
              $manifest.'version-semver' -cnotmatch '^\d+\.\d+\.\d+$' -or
              $env:GITHUB_REF_NAME -cne ('v' + $manifest.'version-semver')) {
              throw 'A release tag must exactly match the manifest version.'
          }
          "sha=$baseline" >> $env:GITHUB_OUTPUT

      - name: Check out vcpkg
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: microsoft/vcpkg
          ref: ${{ steps.registry.outputs.sha }}
          path: .build-tools/vcpkg
          persist-credentials: false

      - name: Build, test, and package
        shell: cmd
        run: |
          for /f "usebackq delims=" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS_INSTALL=%%I"
          if not defined VS_INSTALL exit /b 1
          call "%VS_INSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 || exit /b 1
          set "VCPKG_ROOT=%GITHUB_WORKSPACE%\.build-tools\vcpkg"
          call "%VCPKG_ROOT%\bootstrap-vcpkg.bat" -disableMetrics || exit /b 1
          pwsh -NoProfile -File tools/build-windows-package.ps1 -ExpectedTag "%GITHUB_REF_NAME%" || exit /b 1

      - name: Verify extracted package with a system-only PATH
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem -LiteralPath out/release -Filter 'ARGUS-*-windows-x64.zip')
          if ($packages.Count -ne 1) { throw 'Expected one portable package.' }
          $package = $packages[0].FullName
          $hash = (Get-Content -LiteralPath "$package.sha256" -Raw).Trim().Split(' ')[0]
          ./tools/test-windows-package.ps1 -Package $package -ExpectedSha256 $hash |
              Set-Content -LiteralPath out/release/acceptance.json -Encoding utf8

      - name: Retain verified release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ARGUS-${{ github.ref_name }}-windows-x64
          path: |
            out/release/*.zip
            out/release/*.zip.sha256
            out/release/acceptance.json
          if-no-files-found: error
          retention-days: 30
